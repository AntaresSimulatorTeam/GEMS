# JSON Schema (draft 2020-12), authored in YAML, for GEMS ViewsBuilder view configuration files
# (doc/user-guide/input-files/view-config.md).
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/AntaresSimulatorTeam/GEMS/schemas-v0.1.0/schemas/view-config.schema.yml
title: GEMS view configuration
x-schema-version: 0.1.0
x-status: draft
description: >-
  Root key `view`; unknown keys are rejected (GEMS-ViewsBuilder `ViewBuilderBasedModel`, extra=forbid).
  The patterns on ids come from the ViewsBuilder code; the doc does not state them. Uniqueness of
  (`time-granularity`, `scenario`) across patterns, and the cross-file rules (taxonomy, catalogs,
  metrics) are NOT checked (NOT_COVERED N11).

type: object
required: [view]
additionalProperties: false
properties:
  view:
    type: object
    required: [id, taxonomy, scope, aggregations-patterns, metrics]
    additionalProperties: false
    properties:
      id:
        description: Used in the output file names.
        type: string
        pattern: "^[A-Za-z0-9_]+$"
      taxonomy:
        description: The `id` of the taxonomy file.
        type: string
      scope:
        type: object
        required: [location]
        additionalProperties: false
        properties:
          location:
            type: object
            required: [taxonomy-category]
            additionalProperties: false
            properties:
              taxonomy-category: {type: string}
          extra-locations:
            type: [array, 'null']
            items: {$ref: common.schema.yml#/$defs/IdOnly}
      aggregations-patterns:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/AggregationPattern"}
      metrics:
        type: array
        minItems: 1
        items:
          type: object
          required: [id]
          additionalProperties: false
          properties:
            id:
              description: "`<catalog_id>.<metric_id>`"
              type: string
              pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"

$defs:
  AggregationPattern:
    type: object
    required: [id, time-granularity, scenario]
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^[A-Za-z0-9_]+$"
      time-granularity:
        type: string
        enum: [hour, day, week, month, year]
      scenario: {type: boolean}
      location-filter:
        type: [array, 'null']
        items: {type: string}
