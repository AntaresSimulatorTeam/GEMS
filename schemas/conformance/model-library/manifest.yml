# Conformance manifest for the `model-library` schema.
# valid: true  -> the file must validate.
# valid: false -> the file must fail, with an error at `expect.path` (JSON pointer into the file,
#                 empty = document root) and, when given, `expect.keyword`; `reason` says why.
# source: provenance of real files (copied byte for byte) or `hand-written`.
cases:
- file: valid/gems_basic_models_library.yml
  valid: true
  source: GEMS@9c52d63:libraries/basic_models_library.yml
- file: valid/gems_antares_legacy_models.yml
  valid: true
  source: GEMS@9c52d63:libraries/antares_legacy_models.yml
- file: valid/gems_pypsa_models.yml
  valid: true
  source: GEMS@9c52d63:libraries/pypsa_models.yml
- file: valid/gems_andromede_models.yml
  valid: true
  source: GEMS@9c52d63:libraries/andromede_models.yml
- file: valid/gemspy_lib.yml
  valid: true
  source: GemsPy@b197a14:tests/e2e/functional/libs/lib.yml
- file: valid/viewsbuilder_library.yml
  valid: true
  source: GEMS-ViewsBuilder@975baab:resources/tests_inputs/filtering_and_breakdown/libraries/library.yml
- file: valid/doc_example_bus.yml
  valid: true
  source: hand-written
- file: valid/minimal_library.yml
  valid: true
  source: hand-written
  note: only `library.id` is mandatory
- file: valid/hybrid_port_types.yml
  valid: true
  source: hand-written
- file: valid/variables_numbers_and_binary.yml
  valid: true
  source: hand-written
- file: invalid/missing_library_id.yml
  valid: false
  source: hand-written
  expect:
    path: /library
    keyword: required
  reason: '`library.id` is mandatory'
- file: invalid/root_without_library_key.yml
  valid: false
  source: hand-written
  expect:
    path: ''
    keyword: required
  reason: the single root key must be `library`
- file: invalid/typo_in_model_key.yml
  valid: false
  source: hand-written
  expect:
    path: /library/models/0
    keyword: additionalProperties
  reason: 'unknown key `parameter` (typo): typos must fail'
- file: invalid/snake_case_key.yml
  valid: false
  source: hand-written
  expect:
    path: /library
    keyword: additionalProperties
  reason: 'snake_case spelling of `port-types`: GemsPy accepts it (populate_by_name), C++ and the doc do not (DISCREPANCIES
    L10)'
- file: invalid/model_missing_id.yml
  valid: false
  source: hand-written
  expect:
    path: /library/models/0
    keyword: required
  reason: '`model.id` is mandatory'
- file: invalid/empty_library_id.yml
  valid: false
  source: hand-written
  expect:
    path: /library/id
    keyword: minLength
  reason: id must not be empty
- file: invalid/version_not_a_string.yml
  valid: false
  source: hand-written
  expect:
    path: /library/version
    keyword: type
  reason: '`version` is a string; an unquoted 1.0 is a YAML float'
- file: invalid/port_missing_type.yml
  valid: false
  source: hand-written
  expect:
    path: /library/models/0/ports/0
    keyword: required
  reason: '`ports[].type` is mandatory'
- file: invalid/port_field_definition_missing_definition.yml
  valid: false
  source: hand-written
  expect:
    path: /library/models/0/port-field-definitions/0
    keyword: required
  reason: '`definition` is mandatory'
- file: invalid/constraint_missing_expression.yml
  valid: false
  source: hand-written
  expect:
    path: /library/models/0/constraints/0
    keyword: required
  reason: '`expression` is mandatory'
- file: invalid/extra_output_missing_expression.yml
  valid: false
  source: hand-written
  expect:
    path: /library/models/0/extra-outputs/0
    keyword: required
  reason: '`expression` is mandatory'
- file: invalid/parameter_flag_not_boolean.yml
  valid: false
  source: hand-written
  expect:
    path: /library/models/0/parameters/0/time-dependent
    keyword: type
  reason: flags are booleans
- file: invalid/variable_type_unknown.yml
  valid: false
  source: hand-written
  expect:
    path: /library/models/0/variables/0/variable-type
    keyword: enum
  reason: variable-type is continuous | integer | binary
- file: invalid/variable_location_key.yml
  valid: false
  source: hand-written
  expect:
    path: /library/models/0/variables/0
    keyword: additionalProperties
  reason: '`location` is read by Antares_Simulator only; GemsPy, AntaREST and the doc (placement lives in optim-config)
    reject it (DISCREPANCIES L04)'
- file: invalid/area_connection_missing_key.yml
  valid: false
  source: hand-written
  expect:
    path: /library/port-types/0/area-connection
    keyword: required
  reason: the three keys must all be present (doc, Antares_Simulator); GemsPy and AntaREST accept the omission (DISCREPANCIES
    L07)
- file: invalid/area_connection_all_null.yml
  valid: false
  source: hand-written
  expect:
    path: /library/port-types/0/area-connection
    keyword: anyOf
  reason: at least one of the three keys needs a value (hybrid doc)
- file: invalid/thermal_capacity_connection_without_field.yml
  valid: false
  source: hand-written
  expect:
    path: /library/port-types/0/thermal-capacity-connection
    keyword: required
  reason: '`capacity-field` is mandatory'
- file: invalid/gems_stale_area_connection_list.yml
  valid: false
  source: GEMS@9c52d63:resources/e2e_studies/antares_legacy_models/test_thermal_clusters/GEMS-Thermal-Test/input/model-libraries/antares_legacy_models.yml
  expect:
    path: /library/port-types/0/area-connection
    keyword: type
  reason: 'stale copy of the library in a GEMS e2e study: `area-connection` is a list holding the obsolete key `injection-field`'
  note: upstream data bug (reported in the final report)
- file: invalid/simulator_variable_type_boolean.yml
  valid: false
  source: Antares_Simulator@6744889:resources/modeler/1_4/input/model-libraries/lib_example_1_4.yml
  expect:
    path: /library/models/0/variables/1/variable-type
    keyword: enum
  reason: Antares_Simulator spells the third variable type `boolean`; GEMS doc, GemsPy and AntaREST say `binary`
    (DISCREPANCIES L02)
  note: documented divergence, not a typo
