# Example of GEMS doc/user-guide/input-files/system.md (`description` is documented, accepted by
# Antares_Simulator and AntaREST, but rejected by GemsPy: DISCREPANCIES S01)
system:
  id: my_system
  description: "An example system with one load and one node"
  model-libraries: my_library_1, my_library_2
  components:
    - id: load_1
      model: my_library_1.load
      scenario-group: load_group
      parameters:
        - id: load
          time-dependent: true
          scenario-dependent: false
          value: demand_profile
    - id: bus_1
      model: my_library_2.bus
  connections:
    - component1: bus_1
      component2: load_1
      port1: balance_port
      port2: balance_port
