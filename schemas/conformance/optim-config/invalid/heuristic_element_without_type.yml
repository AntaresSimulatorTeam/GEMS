# the GEMS doc example omits `type` (default `parameter`); GemsPy requires it (DISCREPANCIES O06)
models:
  - id: l.m
    heuristics:
      - id: accurate
        inputs:
          - {heuristic-element: num_units_on_opt, id: a, type: variable-solution}
          - {heuristic-element: num_units_max, id: b}
          - {heuristic-element: min_up_duration, id: c}
          - {heuristic-element: min_down_duration, id: d}
        outputs:
          - {heuristic-element: minimum_num_units_on, id: a, type: variable-lower-bound}
