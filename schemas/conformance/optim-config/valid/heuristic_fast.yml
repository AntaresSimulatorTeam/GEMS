models:
  - id: lib.thermal
    heuristics:
      - id: fast
        inputs:
          - {heuristic-element: generation_power, id: g, type: variable-solution}
          - {heuristic-element: cluster_max_generation, id: cmg, type: parameter}
          - {heuristic-element: min_power_per_unit, id: mnp, type: parameter}
          - {heuristic-element: max_power_per_unit, id: mxp, type: parameter}
          - {heuristic-element: min_up_duration, id: mud, type: parameter}
          - {heuristic-element: min_down_duration, id: mdd, type: parameter}
        outputs:
          - {heuristic-element: minimum_generation_power, id: g, type: variable-lower-bound}
          - {heuristic-element: maximum_generation_power, id: g, type: variable-upper-bound}
