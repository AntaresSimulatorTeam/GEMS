# Conformance manifest for the `taxonomy` schema.
# valid: true  -> the file must validate.
# valid: false -> the file must fail, with an error at `expect.path` (JSON pointer into the file,
#                 empty = document root) and, when given, `expect.keyword`; `reason` says why.
# source: provenance of real files (copied byte for byte) or `hand-written`.
cases:
- file: valid/doc_example.yml
  valid: true
  source: "GEMS@HEAD:doc/user-guide/input-files/taxonomy.md (Example)"
- file: valid/viewsbuilder_filtering_and_breakdown.yml
  valid: true
  source: "GEMS-ViewsBuilder@975baab:resources/tests_inputs/filtering_and_breakdown/taxonomy.yml"
- file: valid/viewsbuilder_test_3.yml
  valid: true
  source: "GEMS-ViewsBuilder@975baab:resources/tests_inputs/test_3/taxonomy.yml"
- file: invalid/root_without_taxonomy_key.yml
  valid: false
  source: "hand-written"
  expect:
    path: ''
    keyword: required
  reason: "root key `taxonomy` is mandatory"
- file: invalid/missing_id.yml
  valid: false
  source: "hand-written"
  expect:
    path: '/taxonomy'
    keyword: required
  reason: "`taxonomy.id` is mandatory"
- file: invalid/typo_category_key.yml
  valid: false
  source: "hand-written"
  expect:
    path: '/taxonomy/categories/0'
    keyword: additionalProperties
  reason: "`variable` instead of `variables`; unknown keys are rejected"
- file: invalid/item_not_an_id_object.yml
  valid: false
  source: "hand-written"
  expect:
    path: '/taxonomy/categories/0/variables/0'
    keyword: type
  reason: "elements are `- id: x`, not bare strings"
