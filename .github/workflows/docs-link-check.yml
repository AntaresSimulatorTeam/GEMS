name: Links Check

on:
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  docs-check:
    name: Links Check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # overpass mkdocs-git-revision-date-localized-plugin

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install doc dependencies
        run: uv sync --frozen --only-group doc

      # Fail if any internal page link is broken
      - name: Build MkDocs
        run: uv run mkdocs build --strict

      # Check all links and images in the built site (local + external)
      # Local image paths are resolved against the built site/ directory,
      # matching what browsers actually render — broken images show alt text
      - name: Check links and images
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress site/
